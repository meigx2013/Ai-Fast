<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="基于 DeepSeek 的 AI 聊天助手">
  <title>AI 聊天助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">AI</div>
        <div>
          <h1>AI 聊天助手</h1>
        </div>
      </div>
      <span class="status"><span class="status-dot"></span>在线</span>
    </header>

    <section id="messages" class="messages" role="log" aria-live="polite" aria-label="聊天记录">
      <div class="message assistant">
        <div class="avatar" aria-hidden="true">AI</div>
        <div class="bubble">你好！我是 AI 聊天助手，有什么可以帮你？</div>
      </div>
    </section>

    <footer class="composer-area">
      <form id="chat-form" class="composer">
        <label for="message-input" class="sr-only">输入消息</label>
        <textarea
          id="message-input"
          rows="2"
          placeholder="输入你的问题..."
          autocomplete="off"
          required
        ></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
      <p class="input-hint">Enter 发送，Shift + Enter 换行</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
