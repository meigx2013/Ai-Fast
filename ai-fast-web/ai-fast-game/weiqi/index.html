<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>弈境 · 双人围棋</title>
  <style>
    :root {
      --ink: #24231f;
      --muted: #79766e;
      --paper: #f5f3ee;
      --card: rgba(255, 255, 255, 0.82);
      --line: #e6e1d8;
      --accent: #9a6337;
      --accent-dark: #714526;
      --accent-soft: #f1e5d7;
      --danger: #b54b42;
      --shadow: 0 16px 45px rgba(53, 43, 30, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(211, 184, 147, 0.2), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(169, 151, 124, 0.12), transparent 28%),
        var(--paper);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    button { font: inherit; }
    button:focus-visible, canvas:focus-visible {
      outline: 3px solid rgba(154, 99, 55, 0.35);
      outline-offset: 3px;
    }

    .app {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 30px 0 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      color: #fff;
      background: var(--ink);
      box-shadow: 0 8px 20px rgba(36, 35, 31, 0.16);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 25px;
    }
    .brand h1 { margin: 0; font-size: 23px; letter-spacing: 0.08em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0.12em; }
    .local-badge {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1.35fr repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 15px 18px;
      border: 1px solid rgba(230, 225, 216, 0.85);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 5px 18px rgba(53, 43, 30, 0.035);
      backdrop-filter: blur(8px);
    }
    .stat-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
    .stat-value { display: block; font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .stat-value small { margin-left: 3px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .mini-stone, .turn-stone {
      flex: 0 0 auto;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      box-shadow: inset -3px -4px 6px rgba(0, 0, 0, 0.18), 0 3px 6px rgba(0, 0, 0, 0.15);
    }
    .black-stone { background: radial-gradient(circle at 33% 27%, #62625f, #171715 58%, #050505); }
    .white-stone { border: 1px solid #d8d5ce; background: radial-gradient(circle at 32% 25%, #fff, #eeeae2 62%, #c8c4bc); }
    .turn-stone { width: 35px; height: 35px; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: start;
      gap: 18px;
    }

    .board-card, .panel {
      border: 1px solid rgba(230, 225, 216, 0.9);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .board-card { padding: 16px; }
    .canvas-wrap {
      position: relative;
      overflow: hidden;
      width: 100%;
      border-radius: 13px;
      background: #d7a55f;
      box-shadow: inset 0 0 0 1px rgba(84, 48, 17, 0.2), 0 8px 22px rgba(74, 46, 20, 0.13);
      aspect-ratio: 1;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    .board-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 13px 4px 0;
      color: var(--muted);
      font-size: 12px;
    }
    #statusText { color: var(--ink); font-weight: 550; }

    .sidebar { display: grid; gap: 14px; }
    .panel { padding: 19px; box-shadow: 0 8px 28px rgba(53, 43, 30, 0.055); }
    .panel-title { margin: 0 0 14px; font-size: 14px; font-weight: 650; letter-spacing: 0.05em; }
    .panel-subtitle { margin: -7px 0 13px; color: var(--muted); font-size: 11px; line-height: 1.6; }

    .size-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 11px; background: #eeebe5; }
    .size-button {
      padding: 8px 4px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }
    .size-button.active { color: var(--ink); background: #fff; box-shadow: 0 2px 8px rgba(53, 43, 30, 0.09); font-weight: 650; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .btn {
      min-height: 41px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #cfc5b7; background: #fdfbf8; }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-primary { grid-column: 1 / -1; border-color: var(--ink); color: #fff; background: var(--ink); }
    .btn-primary:hover:not(:disabled) { border-color: #44423c; background: #44423c; }
    .btn-pass { border-color: var(--accent); background: var(--accent); }
    .btn-pass:hover:not(:disabled) { border-color: var(--accent-dark); background: var(--accent-dark); }

    .rule-note { margin: 13px 0 0; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.7; }

    .history-panel { padding-bottom: 12px; }
    .history-list { display: grid; gap: 4px; max-height: 226px; overflow-y: auto; padding-right: 3px; }
    .history-empty { padding: 12px 0; color: var(--muted); font-size: 12px; text-align: center; }
    .history-item {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }
    .history-item:hover { background: #f2eee8; }
    .history-item.current { background: var(--accent-soft); }
    .history-number { color: var(--muted); font-variant-numeric: tabular-nums; }
    .history-detail { color: var(--muted); font-size: 11px; }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 28px;
      max-width: calc(100% - 32px);
      padding: 11px 18px;
      border-radius: 10px;
      color: #fff;
      background: rgba(36, 35, 31, 0.94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 0.2s, transform 0.2s;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: rgba(155, 59, 51, 0.96); }

    .modal-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(28, 26, 22, 0.5);
      backdrop-filter: blur(4px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(450px, 100%);
      padding: 26px;
      border-radius: 20px;
      background: #faf9f6;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.25);
    }
    .modal-eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 11px; letter-spacing: 0.18em; }
    .modal h2 { margin: 0 0 7px; font-size: 25px; }
    .modal-intro { margin: 0 0 20px; color: var(--muted); font-size: 12px; }
    .score-table { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    .score-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 13px; text-align: center; }
    .score-row:last-child { border-bottom: 0; }
    .score-row > :first-child { text-align: left; }
    .score-head { color: var(--muted); background: #f0ede7; font-size: 11px; }
    .score-total { background: #f7f1e9; font-size: 17px; font-weight: 700; }
    .score-explanation { margin: 15px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.75; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; }
    .modal-actions .btn-primary { grid-column: auto; }

    @media (max-width: 900px) {
      .game-layout { grid-template-columns: minmax(0, 1fr) 280px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
      .app { width: min(100% - 24px, 620px); padding-top: 18px; }
      .header { margin-bottom: 17px; }
      .brand h1 { font-size: 20px; }
      .local-badge { display: none; }
      .game-layout { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr 1fr; }
      .history-panel { grid-column: 1 / -1; }
      .board-card { padding: 10px; }
    }
    @media (max-width: 480px) {
      .stats { gap: 8px; }
      .stat { min-height: 66px; padding: 11px 12px; gap: 9px; }
      .stat-value { font-size: 16px; }
      .turn-stone { width: 29px; height: 29px; }
      .mini-stone { width: 23px; height: 23px; }
      .sidebar { grid-template-columns: 1fr; }
      .history-panel { grid-column: auto; }
      .board-footer { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">弈</div>
        <div>
          <h1>弈境 · 围棋</h1>
          <p>一方棋盘，两人对坐</p>
        </div>
      </div>
      <span class="local-badge">本地双人对弈 · 无需联网</span>
    </header>

    <section class="stats" aria-label="对局信息">
      <div class="stat">
        <span id="turnStone" class="turn-stone black-stone" aria-hidden="true"></span>
        <div><span class="stat-label">当前执棋方</span><strong id="turnText" class="stat-value">黑方落子</strong></div>
      </div>
      <div class="stat">
        <span class="mini-stone black-stone" aria-hidden="true"></span>
        <div><span class="stat-label">黑方提子</span><strong class="stat-value"><span id="blackCaptures">0</span><small>子</small></strong></div>
      </div>
      <div class="stat">
        <span class="mini-stone white-stone" aria-hidden="true"></span>
        <div><span class="stat-label">白方提子</span><strong class="stat-value"><span id="whiteCaptures">0</span><small>子</small></strong></div>
      </div>
      <div class="stat">
        <div><span class="stat-label">对局手数</span><strong class="stat-value"><span id="moveNumber">0</span><small>手</small></strong></div>
      </div>
    </section>

    <div class="game-layout">
      <section class="board-card" aria-label="围棋棋盘">
        <div class="canvas-wrap">
          <canvas id="board" tabindex="0" role="application" aria-label="围棋棋盘，点击交叉点落子"></canvas>
        </div>
        <div class="board-footer">
          <span id="statusText" aria-live="polite">黑方先行，请点击交叉点落子</span>
          <span id="passText">连续两次虚手后数子</span>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <h2 class="panel-title">棋盘规格</h2>
          <div class="size-switch" aria-label="选择棋盘尺寸">
            <button class="size-button" data-size="9" type="button">9 路</button>
            <button class="size-button" data-size="13" type="button">13 路</button>
            <button class="size-button active" data-size="19" type="button">19 路</button>
          </div>
          <p class="panel-subtitle" style="margin: 10px 0 0;">切换尺寸将开始一局新对局</p>
        </section>

        <section class="panel">
          <h2 class="panel-title">对局操作</h2>
          <div class="actions">
            <button id="passButton" class="btn btn-primary btn-pass" type="button">虚手（Pass）</button>
            <button id="undoButton" class="btn" type="button" disabled>悔棋</button>
            <button id="restartButton" class="btn" type="button">重新开始</button>
          </div>
          <p class="rule-note">禁止自杀与立即回提劫。终局采用简易数子法；复杂死活请在虚手前自行处理。</p>
        </section>

        <section class="panel history-panel">
          <h2 class="panel-title">对局记录</h2>
          <p class="panel-subtitle">点击记录可回到该手之后，手数包含虚手</p>
          <div id="historyList" class="history-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="scoreModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
      <p class="modal-eyebrow">对局结束 · 简易数子</p>
      <h2 id="scoreTitle">本局结果</h2>
      <p id="winnerText" class="modal-intro"></p>
      <div class="score-table">
        <div class="score-row score-head"><span>计分项</span><span>黑方</span><span>白方</span></div>
        <div class="score-row"><span>棋盘活子</span><span id="blackStones">0</span><span id="whiteStones">0</span></div>
        <div class="score-row"><span>围空区域</span><span id="blackTerritory">0</span><span id="whiteTerritory">0</span></div>
        <div class="score-row score-total"><span>总分</span><span id="blackTotal">0</span><span id="whiteTotal">0</span></div>
      </div>
      <p id="scoreExplanation" class="score-explanation"></p>
      <div class="modal-actions">
        <button id="viewBoardButton" class="btn" type="button">查看棋盘</button>
        <button id="newGameButton" class="btn btn-primary" type="button">再来一局</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const EMPTY = 0;
      const BLACK = 1;
      const WHITE = 2;
      const PLAYER_NAMES = { [BLACK]: '黑方', [WHITE]: '白方' };
      const COORDINATE_LETTERS = 'ABCDEFGHJKLMNOPQRSTUVWXYZ';

      function otherPlayer(player) {
        return player === BLACK ? WHITE : BLACK;
      }

      function getNeighbors(index, size) {
        const row = Math.floor(index / size);
        const col = index % size;
        const neighbors = [];
        if (row > 0) neighbors.push(index - size);
        if (row < size - 1) neighbors.push(index + size);
        if (col > 0) neighbors.push(index - 1);
        if (col < size - 1) neighbors.push(index + 1);
        return neighbors;
      }

      // 从指定棋子 flood-fill 获取同色连通块及该块的全部气。
      function getGroup(board, size, start) {
        const color = board[start];
        const stones = [];
        const liberties = new Set();
        const visited = new Set([start]);
        const queue = [start];

        for (let cursor = 0; cursor < queue.length; cursor += 1) {
          const current = queue[cursor];
          stones.push(current);
          getNeighbors(current, size).forEach((neighbor) => {
            if (board[neighbor] === EMPTY) {
              liberties.add(neighbor);
            } else if (board[neighbor] === color && !visited.has(neighbor)) {
              visited.add(neighbor);
              queue.push(neighbor);
            }
          });
        }
        return { stones, liberties };
      }

      function countLiberties(board, size, index) {
        return getGroup(board, size, index).liberties.size;
      }

      // 提掉指定位置的无气棋块，返回被提棋子的位置。
      function removeDeadGroup(board, size, start, knownGroup = null) {
        const group = knownGroup || getGroup(board, size, start);
        if (group.liberties.size > 0) return [];
        group.stones.forEach((index) => { board[index] = EMPTY; });
        return group.stones;
      }

      class GoGame {
        constructor(size = 19) {
          this.reset(size);
        }

        reset(size = this.size) {
          if (![9, 13, 19].includes(size)) throw new Error('仅支持 9、13、19 路棋盘');
          this.size = size;
          this.state = {
            board: new Array(size * size).fill(EMPTY),
            currentPlayer: BLACK,
            captures: { [BLACK]: 0, [WHITE]: 0 },
            consecutivePasses: 0,
            gameOver: false,
            lastMove: null,
            previousBoard: null,
            moveNumber: 0
          };
          this.history = [{ action: null, state: this.copyState(this.state) }];
        }

        copyState(state) {
          return {
            ...state,
            board: state.board.slice(),
            captures: { ...state.captures },
            lastMove: state.lastMove ? { ...state.lastMove } : null
          };
        }

        commit(action) {
          this.state.moveNumber += 1;
          this.history.push({ action, state: this.copyState(this.state) });
        }

        play(index) {
          const state = this.state;
          if (state.gameOver) return { ok: false, reason: 'game-over' };
          if (!Number.isInteger(index) || index < 0 || index >= state.board.length) {
            return { ok: false, reason: 'outside' };
          }
          if (state.board[index] !== EMPTY) return { ok: false, reason: 'occupied' };

          const player = state.currentPlayer;
          const opponent = otherPlayer(player);
          const nextBoard = state.board.slice();
          nextBoard[index] = player;
          const checkedGroups = new Set();
          const capturedStones = [];

          // 先检查相邻对方棋块，所有无气棋块均可被一手提取。
          getNeighbors(index, this.size).forEach((neighbor) => {
            if (nextBoard[neighbor] !== opponent || checkedGroups.has(neighbor)) return;
            const group = getGroup(nextBoard, this.size, neighbor);
            group.stones.forEach((stone) => checkedGroups.add(stone));
            if (group.liberties.size === 0) {
              capturedStones.push(...removeDeadGroup(nextBoard, this.size, neighbor, group));
            }
          });

          if (countLiberties(nextBoard, this.size, index) === 0) {
            return { ok: false, reason: 'suicide' };
          }

          const nextBoardKey = nextBoard.join('');
          if (state.previousBoard !== null && nextBoardKey === state.previousBoard) {
            return { ok: false, reason: 'ko' };
          }

          state.previousBoard = state.board.join('');
          state.board = nextBoard;
          state.captures[player] += capturedStones.length;
          state.lastMove = { index, player };
          state.currentPlayer = opponent;
          state.consecutivePasses = 0;
          this.commit({ type: 'play', player, index, captured: capturedStones.length });
          return { ok: true, captured: capturedStones.length };
        }

        pass() {
          const state = this.state;
          if (state.gameOver) return { ok: false, reason: 'game-over' };
          const player = state.currentPlayer;
          state.consecutivePasses += 1;
          state.gameOver = state.consecutivePasses >= 2;
          state.currentPlayer = otherPlayer(player);
          // 虚手会解除简单劫限制，因此不保留上一手之前的棋盘。
          state.previousBoard = null;
          this.commit({ type: 'pass', player, ended: state.gameOver });
          return { ok: true, gameOver: state.gameOver };
        }

        undo() {
          if (this.history.length <= 1) return false;
          this.history.pop();
          this.state = this.copyState(this.history[this.history.length - 1].state);
          return true;
        }

        rollbackTo(turn) {
          if (!Number.isInteger(turn) || turn < 0 || turn >= this.history.length) return false;
          this.history = this.history.slice(0, turn + 1);
          this.state = this.copyState(this.history[this.history.length - 1].state);
          return true;
        }

        // 中国数子法的简化版本：活子与仅接触单方棋子的空区各计一分。
        getScore() {
          const board = this.state.board;
          const visited = new Set();
          const score = {
            black: { stones: 0, territory: 0, total: 0 },
            white: { stones: 0, territory: 0, total: 0 },
            neutral: 0
          };

          board.forEach((color) => {
            if (color === BLACK) score.black.stones += 1;
            if (color === WHITE) score.white.stones += 1;
          });

          for (let start = 0; start < board.length; start += 1) {
            if (board[start] !== EMPTY || visited.has(start)) continue;
            const region = [];
            const borders = new Set();
            const queue = [start];
            visited.add(start);

            for (let cursor = 0; cursor < queue.length; cursor += 1) {
              const current = queue[cursor];
              region.push(current);
              getNeighbors(current, this.size).forEach((neighbor) => {
                const color = board[neighbor];
                if (color === EMPTY && !visited.has(neighbor)) {
                  visited.add(neighbor);
                  queue.push(neighbor);
                } else if (color !== EMPTY) {
                  borders.add(color);
                }
              });
            }

            if (borders.size === 1 && borders.has(BLACK)) score.black.territory += region.length;
            else if (borders.size === 1 && borders.has(WHITE)) score.white.territory += region.length;
            else score.neutral += region.length;
          }

          score.black.total = score.black.stones + score.black.territory;
          score.white.total = score.white.stones + score.white.territory;
          return score;
        }
      }

      const canvas = document.getElementById('board');
      const context = canvas.getContext('2d');
      const game = new GoGame(19);
      let logicalSize = 0;
      let hoverIndex = -1;
      let toastTimer = null;

      const elements = {
        turnStone: document.getElementById('turnStone'),
        turnText: document.getElementById('turnText'),
        blackCaptures: document.getElementById('blackCaptures'),
        whiteCaptures: document.getElementById('whiteCaptures'),
        moveNumber: document.getElementById('moveNumber'),
        statusText: document.getElementById('statusText'),
        passText: document.getElementById('passText'),
        passButton: document.getElementById('passButton'),
        undoButton: document.getElementById('undoButton'),
        restartButton: document.getElementById('restartButton'),
        historyList: document.getElementById('historyList'),
        scoreModal: document.getElementById('scoreModal'),
        winnerText: document.getElementById('winnerText'),
        scoreExplanation: document.getElementById('scoreExplanation'),
        toast: document.getElementById('toast')
      };

      function getGeometry() {
        const padding = logicalSize * 0.072;
        const cell = (logicalSize - padding * 2) / (game.size - 1);
        return { padding, cell };
      }

      function pointToPixel(index) {
        const { padding, cell } = getGeometry();
        return {
          x: padding + (index % game.size) * cell,
          y: padding + Math.floor(index / game.size) * cell
        };
      }

      function drawWood() {
        const base = context.createLinearGradient(0, 0, logicalSize, logicalSize);
        base.addColorStop(0, '#e6bc7c');
        base.addColorStop(0.48, '#dba967');
        base.addColorStop(1, '#c99150');
        context.fillStyle = base;
        context.fillRect(0, 0, logicalSize, logicalSize);

        context.save();
        context.lineWidth = 1;
        for (let line = 0; line < 28; line += 1) {
          const baseY = (line + 0.5) * logicalSize / 28;
          context.beginPath();
          for (let x = 0; x <= logicalSize; x += 10) {
            const y = baseY + Math.sin(x * 0.018 + line * 1.73) * 1.8 + Math.sin(x * 0.047 + line) * 0.7;
            if (x === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.strokeStyle = line % 2 ? 'rgba(103, 57, 22, 0.045)' : 'rgba(255, 244, 213, 0.09)';
          context.stroke();
        }
        const shade = context.createRadialGradient(logicalSize * 0.42, logicalSize * 0.35, logicalSize * 0.1, logicalSize / 2, logicalSize / 2, logicalSize * 0.72);
        shade.addColorStop(0, 'rgba(255,255,255,0.04)');
        shade.addColorStop(1, 'rgba(81,43,15,0.12)');
        context.fillStyle = shade;
        context.fillRect(0, 0, logicalSize, logicalSize);
        context.restore();
      }

      function getStarPoints() {
        if (game.size === 9) return [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]];
        const positions = game.size === 19 ? [3, 9, 15] : [3, 6, 9];
        const points = [];
        positions.forEach((row) => positions.forEach((col) => points.push([row, col])));
        return points;
      }

      function drawGrid() {
        const { padding, cell } = getGeometry();
        const end = padding + cell * (game.size - 1);
        context.save();
        context.strokeStyle = 'rgba(55, 36, 18, 0.82)';
        context.lineWidth = Math.max(0.8, logicalSize / 850);
        context.beginPath();
        for (let line = 0; line < game.size; line += 1) {
          const offset = padding + line * cell;
          context.moveTo(padding, offset);
          context.lineTo(end, offset);
          context.moveTo(offset, padding);
          context.lineTo(offset, end);
        }
        context.stroke();

        context.fillStyle = 'rgba(48, 31, 16, 0.9)';
        getStarPoints().forEach(([row, col]) => {
          context.beginPath();
          context.arc(padding + col * cell, padding + row * cell, Math.max(2, cell * 0.085), 0, Math.PI * 2);
          context.fill();
        });

        const fontSize = Math.max(7, Math.min(11, cell * 0.25));
        context.font = `${fontSize}px system-ui, sans-serif`;
        context.fillStyle = 'rgba(67, 42, 19, 0.66)';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        for (let line = 0; line < game.size; line += 1) {
          const offset = padding + line * cell;
          const letter = COORDINATE_LETTERS[line];
          const number = String(game.size - line);
          context.fillText(letter, offset, padding * 0.4);
          context.fillText(letter, offset, logicalSize - padding * 0.4);
          context.fillText(number, padding * 0.38, offset);
          context.fillText(number, logicalSize - padding * 0.38, offset);
        }
        context.restore();
      }

      function drawStone(index, player, alpha = 1) {
        const { cell } = getGeometry();
        const { x, y } = pointToPixel(index);
        const radius = cell * 0.465;
        context.save();
        context.globalAlpha = alpha;
        context.shadowColor = 'rgba(45, 27, 12, 0.38)';
        context.shadowBlur = radius * 0.28;
        context.shadowOffsetX = radius * 0.08;
        context.shadowOffsetY = radius * 0.14;
        const gradient = context.createRadialGradient(x - radius * 0.32, y - radius * 0.38, radius * 0.08, x, y, radius);
        if (player === BLACK) {
          gradient.addColorStop(0, '#66655f');
          gradient.addColorStop(0.35, '#2d2d2a');
          gradient.addColorStop(1, '#070707');
        } else {
          gradient.addColorStop(0, '#ffffff');
          gradient.addColorStop(0.55, '#f3f0e9');
          gradient.addColorStop(1, '#c4c0b7');
        }
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawLastMove() {
        const lastMove = game.state.lastMove;
        if (!lastMove || game.state.board[lastMove.index] === EMPTY) return;
        const { cell } = getGeometry();
        const { x, y } = pointToPixel(lastMove.index);
        context.save();
        context.fillStyle = lastMove.player === BLACK ? '#e8c078' : '#a55335';
        context.beginPath();
        context.arc(x, y, Math.max(2.2, cell * 0.09), 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function renderBoard() {
        if (!logicalSize) return;
        context.clearRect(0, 0, logicalSize, logicalSize);
        drawWood();
        drawGrid();
        if (hoverIndex >= 0 && game.state.board[hoverIndex] === EMPTY && !game.state.gameOver) {
          drawStone(hoverIndex, game.state.currentPlayer, 0.48);
        }
        game.state.board.forEach((player, index) => {
          if (player !== EMPTY) drawStone(index, player);
        });
        drawLastMove();
      }

      function resizeCanvas() {
        const cssSize = canvas.getBoundingClientRect().width;
        if (!cssSize) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        logicalSize = cssSize;
        canvas.width = Math.round(cssSize * ratio);
        canvas.height = Math.round(cssSize * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        renderBoard();
      }

      function eventToIndex(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * logicalSize / rect.width;
        const y = (event.clientY - rect.top) * logicalSize / rect.height;
        const { padding, cell } = getGeometry();
        const col = Math.round((x - padding) / cell);
        const row = Math.round((y - padding) / cell);
        if (row < 0 || row >= game.size || col < 0 || col >= game.size) return -1;
        const pointX = padding + col * cell;
        const pointY = padding + row * cell;
        if (Math.hypot(x - pointX, y - pointY) > cell * 0.48) return -1;
        return row * game.size + col;
      }

      function toCoordinate(index) {
        const row = Math.floor(index / game.size);
        const col = index % game.size;
        return `${COORDINATE_LETTERS[col]}${game.size - row}`;
      }

      function showToast(message, isError = false) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.toggle('error', isError);
        elements.toast.classList.add('show');
        toastTimer = window.setTimeout(() => elements.toast.classList.remove('show'), 2300);
      }

      function renderStats() {
        const state = game.state;
        const player = state.currentPlayer;
        elements.turnStone.className = `turn-stone ${player === BLACK ? 'black-stone' : 'white-stone'}`;
        elements.turnText.textContent = state.gameOver ? '对局结束' : `${PLAYER_NAMES[player]}落子`;
        elements.blackCaptures.textContent = state.captures[BLACK];
        elements.whiteCaptures.textContent = state.captures[WHITE];
        elements.moveNumber.textContent = state.moveNumber;
        elements.passButton.disabled = state.gameOver;
        elements.undoButton.disabled = state.moveNumber === 0;

        if (state.gameOver) {
          elements.statusText.textContent = '双方连续虚手，对局已结束';
          elements.passText.textContent = '可查看结果或悔棋继续';
        } else if (state.consecutivePasses === 1) {
          elements.statusText.textContent = `${PLAYER_NAMES[otherPlayer(player)]}已虚手，轮到${PLAYER_NAMES[player]}`;
          elements.passText.textContent = '再次虚手将结束对局';
        } else if (state.moveNumber === 0) {
          elements.statusText.textContent = '黑方先行，请点击交叉点落子';
          elements.passText.textContent = '连续两次虚手后数子';
        } else {
          elements.statusText.textContent = `轮到${PLAYER_NAMES[player]}，请在空交叉点落子`;
          elements.passText.textContent = '连续两次虚手后数子';
        }
      }

      function renderHistory() {
        elements.historyList.replaceChildren();
        game.history.forEach((entry, turn) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `history-item${turn === game.history.length - 1 ? ' current' : ''}`;
          button.dataset.turn = String(turn);
          button.title = turn === 0 ? '回到初始局面' : `回到第 ${turn} 手之后`;

          const number = document.createElement('span');
          number.className = 'history-number';
          number.textContent = turn === 0 ? '初始' : String(turn).padStart(2, '0');
          const action = document.createElement('span');
          const detail = document.createElement('span');
          detail.className = 'history-detail';

          if (!entry.action) {
            action.textContent = `${game.size} 路开局`;
            detail.textContent = '黑先';
          } else if (entry.action.type === 'play') {
            action.textContent = `${PLAYER_NAMES[entry.action.player]} · ${toCoordinate(entry.action.index)}`;
            detail.textContent = entry.action.captured ? `提 ${entry.action.captured} 子` : '落子';
          } else {
            action.textContent = `${PLAYER_NAMES[entry.action.player]} · 虚手`;
            detail.textContent = entry.action.ended ? '终局' : 'Pass';
          }
          button.append(number, action, detail);
          elements.historyList.append(button);
        });
        elements.historyList.scrollTop = elements.historyList.scrollHeight;
      }

      function renderAll() {
        renderStats();
        renderHistory();
        renderBoard();
        document.querySelectorAll('.size-button').forEach((button) => {
          button.classList.toggle('active', Number(button.dataset.size) === game.size);
          button.setAttribute('aria-pressed', String(Number(button.dataset.size) === game.size));
        });
      }

      function closeScore() {
        elements.scoreModal.hidden = true;
      }

      function showScore() {
        const score = game.getScore();
        const difference = Math.abs(score.black.total - score.white.total);
        elements.winnerText.textContent = difference === 0
          ? '双方总分相同，本局和棋'
          : `${score.black.total > score.white.total ? '黑方' : '白方'}胜 ${difference} 子`;
        document.getElementById('blackStones').textContent = score.black.stones;
        document.getElementById('whiteStones').textContent = score.white.stones;
        document.getElementById('blackTerritory').textContent = score.black.territory;
        document.getElementById('whiteTerritory').textContent = score.white.territory;
        document.getElementById('blackTotal').textContent = score.black.total;
        document.getElementById('whiteTotal').textContent = score.white.total;
        elements.scoreExplanation.textContent = `计分说明：活子与完全包围的空点各计 1 分，双方接触的空点不计分，本局贴目为 0，共有 ${score.neutral} 个中立空点。此简化规则不自动判定复杂死活，请在终局前提尽死子。`;
        elements.scoreModal.hidden = false;
        document.getElementById('viewBoardButton').focus();
      }

      function startNewGame(size = game.size) {
        closeScore();
        hoverIndex = -1;
        game.reset(size);
        renderAll();
      }

      const errorMessages = {
        'game-over': '本局已结束，可悔棋继续或重新开始',
        occupied: '该交叉点已有棋子，请选择其他位置',
        suicide: '此处落子后己方棋块无气，属于禁入点',
        ko: '劫争限制：不能立即回提，请先在别处落子或虚手'
      };

      canvas.addEventListener('pointermove', (event) => {
        const nextHover = eventToIndex(event);
        if (nextHover !== hoverIndex) {
          hoverIndex = nextHover;
          canvas.style.cursor = hoverIndex >= 0 && game.state.board[hoverIndex] === EMPTY && !game.state.gameOver ? 'pointer' : 'default';
          renderBoard();
        }
      });

      canvas.addEventListener('pointerleave', () => {
        hoverIndex = -1;
        canvas.style.cursor = 'default';
        renderBoard();
      });

      canvas.addEventListener('click', (event) => {
        const index = eventToIndex(event);
        if (index < 0) return;
        const result = game.play(index);
        if (!result.ok) {
          if (errorMessages[result.reason]) showToast(errorMessages[result.reason], true);
          return;
        }
        hoverIndex = -1;
        renderAll();
        if (result.captured > 0) showToast(`提取 ${result.captured} 子`);
      });

      elements.passButton.addEventListener('click', () => {
        const result = game.pass();
        if (!result.ok) return;
        hoverIndex = -1;
        renderAll();
        if (result.gameOver) showScore();
        else showToast(`${PLAYER_NAMES[otherPlayer(game.state.currentPlayer)]}虚手，对方再次虚手即终局`);
      });

      elements.undoButton.addEventListener('click', () => {
        if (!game.undo()) return;
        closeScore();
        hoverIndex = -1;
        renderAll();
        showToast('已撤销上一手');
      });

      elements.restartButton.addEventListener('click', () => {
        startNewGame();
        showToast(`已开始新的 ${game.size} 路对局`);
      });

      document.querySelectorAll('.size-button').forEach((button) => {
        button.addEventListener('click', () => {
          const size = Number(button.dataset.size);
          if (size === game.size && game.state.moveNumber === 0) return;
          startNewGame(size);
          showToast(`已切换为 ${size} 路棋盘`);
        });
      });

      elements.historyList.addEventListener('click', (event) => {
        const button = event.target.closest('.history-item');
        if (!button) return;
        const turn = Number(button.dataset.turn);
        if (turn === game.history.length - 1) return;
        if (game.rollbackTo(turn)) {
          closeScore();
          hoverIndex = -1;
          renderAll();
          showToast(turn === 0 ? '已回到初始局面' : `已回到第 ${turn} 手之后`);
        }
      });

      document.getElementById('viewBoardButton').addEventListener('click', closeScore);
      document.getElementById('newGameButton').addEventListener('click', () => {
        startNewGame();
        showToast('新对局开始，黑方先行');
      });
      elements.scoreModal.addEventListener('click', (event) => {
        if (event.target === elements.scoreModal) closeScore();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !elements.scoreModal.hidden) closeScore();
      });

      if ('ResizeObserver' in window) {
        new ResizeObserver(resizeCanvas).observe(canvas);
      } else {
        window.addEventListener('resize', resizeCanvas);
      }

      renderAll();
      resizeCanvas();
    })();
  </script>
</body>
</html>
