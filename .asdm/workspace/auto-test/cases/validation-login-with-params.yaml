# Phase 3 验证用例 1：带参数化 + 断言推断 + 选择器优化 + 步骤优化的登录录制产出物
# 本文件用于验证 auto-test-record 录制产出物是否符合 DSL Spec 全部新增字段

name: validation-login-with-params
description: "端到端验证用例 - 登录流程（带参数化、断言推断、选择器优化）"
framework: playwright
tags:
  - module:auth
  - feature:login
  - validation:e2e

params:
  username: "admin"
  password: "admin123"

recordedAt: "2026-07-20T10:30:00Z"

pageStructure:
  mainElements:
    - selector: "[data-testid='login-form']"
      type: form
      role: "登录表单容器"
    - selector: "[data-testid='username-input']"
      type: input
      role: "用户名输入框"
    - selector: "[data-testid='password-input']"
      type: input
      role: "密码输入框"
    - selector: "[data-testid='login-btn']"
      type: button
      role: "登录提交按钮"

viewportActual:
  width: 1280
  height: 720

frontFramework: vue

selectorStrategy: optimize

stages:
  - name: "登录"
    steps:
      # Step 1: navigate → 选择器优化: body → [data-testid='login-form'] 容器
      - action: navigate
        target: "/login"
        pageTransition: navigate
        assertions:
          - type: visible
            target: "[data-testid='login-form']"
            confidence: high
            inferredFrom: "navigate后页面结构[data-testid]"
          - type: titleMatch
            expected: "登录"
            confidence: high
            inferredFrom: "navigate后页面标题"

      # Step 2-3: type 合并为 form-fill-group（步骤优化 5c）
      # form-fill-group: 连续 type 操作合并注释
      - action: type
        target: "[data-testid='username-input']"
        value: "{{params.username}}"
        comment: "form-fill-group: 连续输入合并 — 用户名+密码"
        assertions:
          - type: valueMatch
            target: "[data-testid='username-input']"
            expected: "{{params.username}}"
            confidence: high
            inferredFrom: "type操作输入值验证"

      - action: type
        target: "[data-testid='password-input']"
        value: "{{params.password}}"
        comment: "form-fill-group: 连续输入合并 — 用户名+密码"
        assertions:
          - type: valueMatch
            target: "[data-testid='password-input']"
            expected: "{{params.password}}"
            confidence: high
            inferredFrom: "type操作输入值验证"

      # Step 4: click → 选择器优化: button.btn-primary → [data-testid='login-btn']
      # 智能等待（步骤优化 5c）：提交按钮后自动 waitForSelector
      - action: click
        target: "[data-testid='login-btn']"
        comment: "智能等待: 提交按钮后自动等待页面响应"
        assertions:
          - type: urlMatch
            expected: "/dashboard"
            confidence: medium
            inferredFrom: "click后URL实际跳转"
          - type: textMatch
            target: "[data-testid='welcome-msg']"
            expected: "欢迎"
            confidence: medium
            inferredFrom: "click后文案变化"

  - name: "验证登录成功"
    steps:
      - action: visible
        target: "[data-testid='user-avatar']"
        assertions:
          - type: visible
            target: "[data-testid='user-avatar']"
            confidence: high
            inferredFrom: "页面结构动态变化[data-testid]"
