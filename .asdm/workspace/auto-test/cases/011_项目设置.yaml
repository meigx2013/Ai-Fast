name: 011_project-config-succ
description: 验证用户在项目中进行项目设置（正向场景）
framework: playwright
capture: on-fail
tags: [project, config, happy-path, P2]
source: generate
params:
  repoType: github
  authMethod: Token
  repoUrl: https://github.com/meigx2013/Ai-Fast
  repoBranch: develop
  repoToken: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户test01@asdm.ai已完成系统登录
    - 项目"测试组织0101-项目01"已创建
    - 已进入"测试组织0101-项目01"项目页面
stages:
  - name: 进入项目设置页面
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: ".project-list .project-item:has-text(\"测试组织0101-项目01\") .project-name"
      - action: assert
        assertions:
          - type: A1
            target: .project-settings
            expected: visible
            confidence: medium
            inferredFrom: "点击项目名称后进入项目设置页面"
            message: 项目设置页面应可见
  - name: 进入其他Tab
    steps:
      - action: click
        target: .project-settings .tab-other
      - action: assert
        assertions:
          - type: A1
            target: .repo-config-list
            expected: visible
            confidence: medium
            inferredFrom: "点击其他Tab后仓库配置列表可见"
            message: 仓库配置列表应可见
  - name: 添加仓库配置
    steps:
      - action: click
        target: .repo-config-list .add-repo-btn
      - action: assert
        assertions:
          - type: A1
            target: .add-repo-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击添加仓库配置后弹出窗口"
            message: 添加仓库配置窗口应可见
  - name: 录入仓库信息
    steps:
      - action: select
        target: .add-repo-modal select[name="repoType"]
        value: "{{params.repoType}}"
      - action: select
        target: .add-repo-modal select[name="authMethod"]
        value: "{{params.authMethod}}"
      - action: type
        target: .add-repo-modal input[name="repoUrl"]
        value: "{{params.repoUrl}}"
      - action: type
        target: .add-repo-modal input[name="repoBranch"]
        value: "{{params.repoBranch}}"
      - action: type
        target: .add-repo-modal input[name="repoToken"]
        value: "{{params.repoToken}}"
  - name: 保存并验证
    steps:
      - action: click
        target: .add-repo-modal .btn-save
        capture: always
      - action: wait
        target: .repo-config-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .repo-config-list
            expected: "{{params.repoUrl}}"
            confidence: medium
            inferredFrom: "预期结果：仓库配置列表中增加一条记录"
            message: 仓库配置列表中应包含"{{params.repoUrl}}"记录
  - name: 检测可用性
    steps:
      - action: click
        target: ".repo-config-list .repo-config-item:has-text(\"{{params.repoUrl}}\") .check-availability-btn"
      - action: wait
        target: .repo-config-list
        timeout: 10
      - action: assert
        assertions:
          - type: A4
            target: ".repo-config-list .repo-config-item:has-text(\"{{params.repoUrl}}\") .check-result"
            expected: 成功
            confidence: medium
            inferredFrom: "预期结果：检测可用性成功"
            message: 仓库可用性检测应返回成功
