name: 007_pipeline-config-succ
description: 验证管理员进行流水线配置（正向场景）
framework: playwright
capture: on-fail
tags: [pipeline, config, create, happy-path, P1]
source: generate
params:
  pipelineName: pipeline
  pipelineType: Jenkins
  jenkinsCredential: "admin:11f054f0964f8cb86a627b296929b9df59"
  asdmPatToken: "{{params.patToken}}"
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - PAT令牌已创建
stages:
  - name: 进入管理后台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/dashboard
      - action: click
        target: .sidebar .platform-settings-btn
      - action: assert
        assertions:
          - type: A1
            target: .workspace .settings-page
            expected: visible
            confidence: medium
            inferredFrom: "click后右侧工作区打开设置页面"
            message: 平台级设置页面应可见
  - name: 打开其他设置
    steps:
      - action: click
        target: .settings-page .other-tab
      - action: assert
        assertions:
          - type: A1
            target: .pipeline-config-list
            expected: visible
            confidence: medium
            inferredFrom: "click后流水线配置列表区域"
            message: 其他Tab页签应可见
  - name: 添加流水线配置
    steps:
      - action: click
        target: .pipeline-config-list .add-pipeline-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-pipeline-dialog
            expected: visible
            confidence: medium
            inferredFrom: "click后新增流水线配置窗口打开"
            message: 新增流水线配置窗口应可见
      - action: type
        target: .create-pipeline-dialog input[name="name"]
        value: "{{params.pipelineName}}"
      - action: select
        target: .create-pipeline-dialog select[name="pipelineType"]
        value: "{{params.pipelineType}}"
      - action: type
        target: .create-pipeline-dialog input[name="jenkinsCredential"]
        value: "{{params.jenkinsCredential}}"
      - action: select
        target: .create-pipeline-dialog select[name="contextSyncJenkinsfile"]
        value: "context/asdm-context-space-sync.no-docker.Jenkinsfile"
      - action: select
        target: .create-pipeline-dialog select[name="workspaceExecJenkinsfile"]
        value: "workspace/asdm-workspace-exec.no-docker.Jenkinsfile"
      - action: select
        target: .create-pipeline-dialog select[name="contextAnalyzeJenkinsfile"]
        value: "context/asdm-context-analyze.no-docker.Jenkinsfile"
      - action: type
        target: .create-pipeline-dialog input[name="asdmApiPat"]
        value: "{{params.asdmPatToken}}"
      - action: click
        target: .create-pipeline-dialog .create-btn
        capture: always
  - name: 验证流水线配置创建
    steps:
      - action: wait
        target: .pipeline-config-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .pipeline-config-list
            expected: "{{params.pipelineName}}"
            confidence: high
            inferredFrom: "预期结果-流水线配置创建成功"
            message: 流水线配置应创建成功
