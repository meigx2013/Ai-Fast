name: 007_pipeline-config-succ
description: 验证管理员进行流水线配置（正向场景）
framework: playwright
capture: on-fail
tags: [pipeline, admin, happy-path, P2]
source: generate
params:
  pipelineName: pipeline
  jenkinsCredential: admin:11f054f0964f8cb86a627b296929b9df59
  asdmPat: "{{params.patToken}}"
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - PAT令牌已创建
stages:
  - name: 进入平台级设置-其他
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .platform-settings .tab-other
      - action: assert
        assertions:
          - type: A1
            target: .pipeline-config-list
            expected: visible
            confidence: medium
            inferredFrom: "点击其他Tab后流水线配置列表可见"
            message: 流水线配置列表应可见
  - name: 新增流水线配置
    steps:
      - action: click
        target: .pipeline-config-list .add-pipeline-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-pipeline-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击添加后弹出窗口"
            message: 新增流水线配置窗口应可见
  - name: 录入流水线信息
    steps:
      - action: type
        target: .create-pipeline-modal input[name="name"]
        value: "{{params.pipelineName}}"
      - action: select
        target: .create-pipeline-modal select[name="pipelineType"]
        value: Jenkins
      - action: type
        target: .create-pipeline-modal input[name="jenkinsCredential"]
        value: "{{params.jenkinsCredential}}"
      - action: select
        target: .create-pipeline-modal select[name="contextSyncJenkinsfile"]
        value: context/asdm-context-space-sync.no-docker.Jenkinsfile
      - action: select
        target: .create-pipeline-modal select[name="workspaceExecJenkinsfile"]
        value: workspace/asdm-workspace-exec.no-docker.Jenkinsfile
      - action: select
        target: .create-pipeline-modal select[name="contextAnalyzeJenkinsfile"]
        value: context/asdm-context-analyze.no-docker.Jenkinsfile
      - action: type
        target: .create-pipeline-modal input[name="asdmApiPat"]
        value: "{{params.asdmPat}}"
  - name: 创建并验证
    steps:
      - action: click
        target: .create-pipeline-modal .btn-create
        capture: always
      - action: wait
        target: .pipeline-config-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .pipeline-config-list
            expected: "{{params.pipelineName}}"
            confidence: medium
            inferredFrom: "预期结果：流水线配置创建成功"
            message: 流水线配置列表中应包含"{{params.pipelineName}}"
