name: 009_resource-management-succ
description: 验证管理员进行平台级资源管理（正向场景）
framework: playwright
capture: on-fail
tags: [resource, admin, happy-path, P2]
source: generate
params:
  uploadScope: 全局
  resourceType: 场景智能体
  fileName: basic-tools-v2.zip
  category: 研发主流程
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 打开目录中存在一款场景智能体（如：basic-tools-v2.zip）
stages:
  - name: 进入平台级设置-资源管理
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .platform-settings .tab-resource
      - action: assert
        assertions:
          - type: A1
            target: .resource-list
            expected: visible
            confidence: medium
            inferredFrom: "点击资源管理Tab后列表可见"
            message: 资源管理列表应可见
  - name: 上传资源
    steps:
      - action: click
        target: .resource-list .upload-resource-btn
      - action: assert
        assertions:
          - type: A1
            target: .upload-resource-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击上传资源后弹出窗口"
            message: 上传资源窗口应可见
  - name: 录入资源信息
    steps:
      - action: select
        target: .upload-resource-modal select[name="uploadScope"]
        value: "{{params.uploadScope}}"
      - action: select
        target: .upload-resource-modal select[name="resourceType"]
        value: "{{params.resourceType}}"
      - action: upload
        target: .upload-resource-modal input[type="file"]
        value: D:\\TEST01\\toolset\\basic-tools-v2.zip
      - action: select
        target: .upload-resource-modal select[name="category"]
        value: "{{params.category}}"
  - name: 提交并验证
    steps:
      - action: click
        target: .upload-resource-modal .btn-upload
        capture: always
      - action: wait
        target: .resource-list
        timeout: 5
      - action: assert
        assertions:
          - type: A4
            target: .resource-list
            expected: "{{params.fileName}}"
            confidence: medium
            inferredFrom: "预期结果：资源管理列表中增加一条记录"
            message: 资源管理列表中应包含"{{params.fileName}}"记录
