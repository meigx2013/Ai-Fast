name: 009_resource-management-succ
description: 验证管理员进行平台级资源管理（正向场景）
framework: playwright
capture: on-fail
tags: [resource, upload, management, happy-path, P1]
source: generate
params:
  uploadScope: 全局
  resourceType: 场景智能体
  fileName: basic-tools-v2.zip
  category: 研发主流程
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 打开目录中存在一款场景智能体（如：basic-tools-v2.zip）
stages:
  - name: 进入管理后台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/dashboard
      - action: click
        target: .sidebar .platform-settings-btn
      - action: assert
        assertions:
          - type: A1
            target: .workspace .settings-page
            expected: visible
            confidence: medium
            inferredFrom: "click后右侧工作区打开设置页面"
            message: 平台级设置页面应可见
  - name: 打开资源管理页签
    steps:
      - action: click
        target: .settings-page .resource-tab
      - action: assert
        assertions:
          - type: A1
            target: .resource-list
            expected: visible
            confidence: medium
            inferredFrom: "click后资源管理列表区域"
            message: 资源管理Tab页签应可见
  - name: 上传资源
    steps:
      - action: click
        target: .resource-list .upload-resource-btn
      - action: assert
        assertions:
          - type: A1
            target: .upload-resource-dialog
            expected: visible
            confidence: medium
            inferredFrom: "click后上传资源窗口打开"
            message: 上传资源窗口应可见
      - action: select
        target: .upload-resource-dialog select[name="uploadScope"]
        value: "{{params.uploadScope}}"
      - action: select
        target: .upload-resource-dialog select[name="resourceType"]
        value: "{{params.resourceType}}"
      - action: upload
        target: .upload-resource-dialog input[type="file"]
        value: "D:\\TEST01\\toolset\\{{params.fileName}}"
      - action: select
        target: .upload-resource-dialog select[name="category"]
        value: "{{params.category}}"
      - action: click
        target: .upload-resource-dialog .upload-btn
        capture: always
  - name: 验证资源上传
    steps:
      - action: wait
        target: .resource-list
        timeout: 5
      - action: assert
        assertions:
          - type: A4
            target: .resource-list
            expected: "{{params.fileName}}"
            confidence: high
            inferredFrom: "预期结果-资源管理列表中增加一条记录"
            message: 资源管理列表中应增加一条记录
