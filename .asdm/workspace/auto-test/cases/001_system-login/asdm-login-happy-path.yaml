name: asdm-login-happy-path
description: 验证用户通过ASDM平台登录流程（正向场景）
framework: playwright
capture: on-fail
tags: [auth, login, happy-path, P1]
source: generate
params:
  email: super-admin@asdm.ai
  password: superadmin@20260214
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
stages:
  - name: 访问ASDM平台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: assert
        assertions:
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "navigate后页面头部元素"
            message: ASDM平台页面应可见
  - name: 点击登录入口
    steps:
      - action: click
        target: .header .login-btn
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .login-form
            expected: visible
            confidence: medium
            inferredFrom: "点击登录后页面跳转"
            message: 登录表单应可见
  - name: 输入凭证
    steps:
      - action: type
        target: .login-form input[name="email"]
        value: "{{params.email}}"
      - action: type
        target: .login-form input[name="password"]
        value: "{{params.password}}"
      - action: click
        target: .login-form .btn-primary
        capture: always
  - name: 登录验证
    steps:
      - action: wait
        target: .user-info
        timeout: 5
      - action: assert
        assertions:
          - type: A2
            target: current-url
            expected: /dashboard
            confidence: medium
            inferredFrom: "登录成功后应跳转"
            message: 登录成功后应跳转到仪表盘页面
          - type: A1
            target: .user-info
            expected: visible
            confidence: medium
            inferredFrom: "登录成功后用户信息应可见"
            message: 用户信息区域应可见
