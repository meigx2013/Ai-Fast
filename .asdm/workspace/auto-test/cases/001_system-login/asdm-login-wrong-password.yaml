name: asdm-login-wrong-password
description: 验证错误密码登录失败（逆向场景）
framework: playwright
capture: on-fail
tags: [auth, login, negative, P1]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
stages:
  - name: 访问ASDM平台并打开登录
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: click
        target: .header .login-btn
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .login-form
            expected: visible
            confidence: medium
            inferredFrom: "点击登录后页面跳转"
            message: 登录表单应可见
  - name: 输入错误密码
    steps:
      - action: type
        target: .login-form input[name="email"]
        value: super-admin@asdm.ai
      - action: type
        target: .login-form input[name="password"]
        value: wrong-password
      - action: click
        target: .login-form .btn-primary
      - action: wait
        target: .error-message
        timeout: 3
      - action: assert
        assertions:
          - type: A1
            target: .error-message
            expected: visible
            confidence: medium
            inferredFrom: "错误密码登录应显示错误提示"
            message: 错误提示应可见
          - type: A4
            target: .error-message
            expected: 密码错误
            confidence: low
            inferredFrom: "错误密码常见提示文案"
            message: 错误提示内容应为"密码错误"
