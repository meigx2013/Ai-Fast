name: 005_create-user-succ
description: 验证管理员进行用户创建（正向场景）
framework: playwright
capture: on-fail
tags: [user, create, happy-path, P1]
source: generate
params:
  userEmail: test01@asdm.ai
  userPassword: admin@2026
  userLastName: 测试
  userFirstName: 一
  roleName: 组织管理员
  orgName: 测试组织0101
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 已创建组织"测试组织0101"
stages:
  - name: 进入管理后台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/dashboard
      - action: click
        target: .sidebar .platform-settings-btn
      - action: assert
        assertions:
          - type: A1
            target: .workspace .settings-page
            expected: visible
            confidence: medium
            inferredFrom: "click后右侧工作区打开设置页面"
            message: 平台级设置页面应可见
  - name: 打开用户页签
    steps:
      - action: click
        target: .settings-page .user-tab
      - action: assert
        assertions:
          - type: A1
            target: .user-list
            expected: visible
            confidence: medium
            inferredFrom: "click后用户列表区域"
            message: 用户Tab页签应可见
  - name: 创建用户
    steps:
      - action: click
        target: .user-list .create-user-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-user-dialog
            expected: visible
            confidence: medium
            inferredFrom: "click后新建用户窗口打开"
            message: 新建用户窗口应可见
      - action: type
        target: .create-user-dialog input[name="email"]
        value: "{{params.userEmail}}"
      - action: type
        target: .create-user-dialog input[name="password"]
        value: "{{params.userPassword}}"
      - action: type
        target: .create-user-dialog input[name="lastName"]
        value: "{{params.userLastName}}"
      - action: type
        target: .create-user-dialog input[name="firstName"]
        value: "{{params.userFirstName}}"
  - name: 添加角色映射
    steps:
      - action: click
        target: .create-user-dialog .add-role-mapping-btn
      - action: select
        target: .create-user-dialog .role-select:first-of-type
        value: "{{params.roleName}}"
      - action: select
        target: .create-user-dialog .org-select:nth-of-type(2)
        value: "{{params.orgName}}"
      - action: click
        target: .create-user-dialog .create-user-btn
        capture: always
  - name: 验证用户创建
    steps:
      - action: wait
        target: .user-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .user-list
            expected: "{{params.userEmail}}"
            confidence: high
            inferredFrom: "预期结果-用户列表中增加一条记录"
            message: 用户列表中应增加一条记录
