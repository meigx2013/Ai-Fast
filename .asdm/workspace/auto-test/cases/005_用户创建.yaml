name: 005_create-user-succ
description: 验证管理员进行用户创建（正向场景）
framework: playwright
capture: on-fail
tags: [user, admin, happy-path, P1]
source: generate
params:
  userEmail: test01@asdm.ai
  userPassword: admin@2026
  userLastName: 测试
  userFirstName: 一
  roleName: 组织管理员
  orgName: 测试组织0101
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 已创建组织"测试组织0101"
stages:
  - name: 进入平台级设置-用户
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .platform-settings .tab-user
      - action: assert
        assertions:
          - type: A1
            target: .user-list
            expected: visible
            confidence: medium
            inferredFrom: "点击用户Tab后用户列表可见"
            message: 用户列表应可见
  - name: 创建新用户
    steps:
      - action: click
        target: .user-list .create-user-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-user-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击创建用户后弹出窗口"
            message: 新建用户窗口应可见
  - name: 录入用户信息
    steps:
      - action: type
        target: .create-user-modal input[name="email"]
        value: "{{params.userEmail}}"
      - action: type
        target: .create-user-modal input[name="password"]
        value: "{{params.userPassword}}"
      - action: type
        target: .create-user-modal input[name="lastName"]
        value: "{{params.userLastName}}"
      - action: type
        target: .create-user-modal input[name="firstName"]
        value: "{{params.userFirstName}}"
  - name: 添加角色映射
    steps:
      - action: click
        target: .create-user-modal .add-role-mapping-btn
      - action: select
        target: .create-user-modal .role-select
        value: "{{params.roleName}}"
      - action: select
        target: .create-user-modal .org-select
        value: "{{params.orgName}}"
      - action: click
        target: .create-user-modal .btn-create-user
        capture: always
  - name: 验证用户创建
    steps:
      - action: wait
        target: .user-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .user-list
            expected: "{{params.userEmail}}"
            confidence: medium
            inferredFrom: "预期结果：用户列表中增加一条记录"
            message: 用户列表中应增加"{{params.userEmail}}"记录
