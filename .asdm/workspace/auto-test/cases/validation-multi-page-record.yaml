# Phase 3 验证用例 2：多页面录制产出物（pageContext + pageTransition）
# 本文件用于验证多页面录制场景下 pageContext/pageTransition 字段是否合规

name: validation-multi-page-record
description: "端到端验证用例 - 多页面录制（新标签页打开 + popup）"
framework: playwright
tags:
  - module:dashboard
  - feature:report-export
  - validation:e2e

recordedAt: "2026-07-20T10:35:00Z"

viewportActual:
  width: 1280
  height: 720

frontFramework: vue

selectorStrategy: optimize

stages:
  - name: "主页面操作"
    steps:
      - action: navigate
        target: "/dashboard"
        pageTransition: navigate
        assertions:
          - type: visible
            target: "[data-testid='dashboard-container']"
            confidence: high
            inferredFrom: "navigate后页面结构[data-testid]"

      - action: click
        target: "[data-testid='export-btn']"
        pageTransition: new-tab
        assertions:
          - type: visible
            target: "[data-testid='export-dialog']"
            confidence: high
            inferredFrom: "click后页面结构[data-testid]"

  - name: "新标签页操作"
    steps:
      # pageContext: newTab 标记步骤在新标签页执行
      # 应紧跟 pageTransition: new-tab 的步骤之后
      - action: visible
        target: "[data-testid='report-preview']"
        pageContext: newTab
        assertions:
          - type: visible
            target: "[data-testid='report-preview']"
            confidence: high
            inferredFrom: "新标签页页面结构[data-testid]"

      - action: click
        target: "[data-testid='download-btn']"
        pageContext: newTab
        assertions:
          - type: urlMatch
            expected: "/api/report/download"
            confidence: medium
            inferredFrom: "click后URL跳转"

  - name: "返回主页面"
    steps:
      # pageContext: main 返回主页面
      - action: click
        target: "[data-testid='close-tab-btn']"
        pageContext: main
        assertions:
          - type: visible
            target: "[data-testid='dashboard-container']"
            confidence: high
            inferredFrom: "页面结构动态变化[data-testid]"
