name: 006_generate-pat-succ
description: 验证用户进行PAT令牌创建（正向场景）
framework: playwright
capture: on-fail
tags: [token, pat, happy-path, P1]
source: generate
params:
  tokenName: asdm-pat
  tokenValidity: 30
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
stages:
  - name: 进入用户资料页面
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .header .user-info
      - action: click
        target: .user-panel .access-token-link
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .user-profile
            expected: visible
            confidence: medium
            inferredFrom: "点击访问令牌后进入用户资料页面"
            message: 用户资料页面应可见
  - name: 进入访问令牌Tab
    steps:
      - action: click
        target: .user-profile .tab-access-token
      - action: assert
        assertions:
          - type: A1
            target: .token-list
            expected: visible
            confidence: medium
            inferredFrom: "点击访问令牌Tab后令牌列表可见"
            message: 访问令牌列表应可见
  - name: 创建令牌
    steps:
      - action: click
        target: .token-list .create-token-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-pat-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击创建令牌后弹出窗口"
            message: 创建个人访问令牌窗口应可见
      - action: type
        target: .create-pat-modal input[name="tokenName"]
        value: "{{params.tokenName}}"
      - action: select
        target: .create-pat-modal select[name="validity"]
        value: "{{params.tokenValidity}}天"
      - action: click
        target: .create-pat-modal .btn-create
        capture: always
  - name: 复制令牌并验证
    steps:
      - action: click
        target: .create-pat-modal .btn-copy-token
      - action: assert
        assertions:
          - type: A1
            target: .create-pat-modal .token-value
            expected: visible
            confidence: medium
            inferredFrom: "预期结果：令牌生成成功"
            message: 生成的令牌应可见
          - type: A4
            target: .create-pat-modal .token-value
            expected: pat_
            confidence: medium
            inferredFrom: "令牌格式以pat_开头"
            message: 令牌格式应以pat_开头
