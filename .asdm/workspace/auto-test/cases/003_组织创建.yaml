name: 003_create-org-succ
description: 验证管理员进行组织架构创建（正向场景）
framework: playwright
capture: on-fail
tags: [org, create, happy-path, P1]
source: generate
params:
  orgName: 测试组织01
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
stages:
  - name: 进入管理后台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/dashboard
      - action: assert
        assertions:
          - type: A1
            target: .dashboard
            expected: visible
            confidence: medium
            inferredFrom: "navigate后页面结构"
            message: ASDM管理后台首页面应可见
  - name: 打开平台级设置
    steps:
      - action: click
        target: .sidebar .platform-settings-btn
      - action: assert
        assertions:
          - type: A1
            target: .workspace .settings-page
            expected: visible
            confidence: medium
            inferredFrom: "click后右侧工作区打开设置页面"
            message: 平台级设置页面应可见
  - name: 打开组织页签
    steps:
      - action: click
        target: .settings-page .org-tab
      - action: assert
        assertions:
          - type: A1
            target: .org-tree
            expected: visible
            confidence: medium
            inferredFrom: "click后组织树区域"
            message: 组织Tab页签应可见
  - name: 创建顶层组织
    steps:
      - action: click
        target: .org-tree .create-top-org-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-org-dialog
            expected: visible
            confidence: medium
            inferredFrom: "click后创建窗口打开"
            message: 创建顶层组织窗口应可见
      - action: type
        target: .create-org-dialog input[name="orgName"]
        value: "{{params.orgName}}"
      - action: click
        target: .create-org-dialog .create-btn
        capture: always
  - name: 验证组织创建
    steps:
      - action: wait
        target: .org-tree
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .org-tree
            expected: "{{params.orgName}}"
            confidence: high
            inferredFrom: "预期结果-组织树增加节点"
            message: 组织树应增加一个节点"{{params.orgName}}"
