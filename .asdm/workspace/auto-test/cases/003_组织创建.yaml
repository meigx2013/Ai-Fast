name: 003_create-org-succ
description: 验证管理员进行组织架构的创建（正向场景）
framework: playwright
capture: on-fail
tags: [org, admin, happy-path, P1]
source: generate
params:
  orgName: 测试组织01
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
stages:
  - name: 进入平台级设置
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: assert
        assertions:
          - type: A1
            target: .platform-settings
            expected: visible
            confidence: medium
            inferredFrom: "点击平台级设置后右侧工作区打开"
            message: 平台级设置页面应可见
  - name: 进入组织Tab
    steps:
      - action: click
        target: .platform-settings .tab-org
      - action: assert
        assertions:
          - type: A1
            target: .org-tree
            expected: visible
            confidence: medium
            inferredFrom: "点击组织Tab后组织树应可见"
            message: 组织树应可见
  - name: 创建顶层组织
    steps:
      - action: click
        target: .org-tree .create-top-org-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-org-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击创建顶层组织后弹出窗口"
            message: 创建顶层组织窗口应可见
      - action: type
        target: .create-org-modal input[name="orgName"]
        value: "{{params.orgName}}"
      - action: click
        target: .create-org-modal .btn-create
        capture: always
  - name: 验证组织创建
    steps:
      - action: wait
        target: .org-tree
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .org-tree
            expected: "{{params.orgName}}"
            confidence: medium
            inferredFrom: "预期结果：组织树增加节点"
            message: 组织树应增加节点"{{params.orgName}}"
