name: 002_access-asdm-admin-succ
description: 验证用户完成系统登录后，从Portal跳转到ASDM管理后台（正向场景）
framework: playwright
capture: on-fail
tags: [navigation, admin, happy-path, P1]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
stages:
  - name: 访问Portal首页
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: assert
        assertions:
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "navigate后Portal首页结构"
            message: Portal首页应可见
  - name: 点击用户信息
    steps:
      - action: click
        target: .header .user-info
      - action: assert
        assertions:
          - type: A1
            target: .user-panel
            expected: visible
            confidence: medium
            inferredFrom: "点击用户信息后弹出面板"
            message: 用户信息面板应可见
  - name: 进入控制台管理
    steps:
      - action: click
        target: .user-panel .console-admin-btn
        pageTransition: navigate
        capture: always
  - name: 验证管理后台
    steps:
      - action: wait
        target: .admin-panel
        timeout: 5
      - action: assert
        assertions:
          - type: A1
            target: .admin-panel
            expected: visible
            confidence: medium
            inferredFrom: "预期结果：成功跳转到ASDM管理后台首页面"
            message: ASDM管理后台首页面应可见
          - type: A2
            target: current-url
            expected: /admin
            confidence: medium
            inferredFrom: "预期结果：跳转到管理后台"
            message: 页面应跳转到ASDM管理后台
