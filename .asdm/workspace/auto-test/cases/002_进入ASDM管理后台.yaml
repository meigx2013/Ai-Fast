name: 002_access-asdm-succ
description: 验证用户从Portal跳转到ASDM管理后台（正向场景）
framework: playwright
capture: on-fail
tags: [navigation, portal, happy-path, P1]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
stages:
  - name: 访问Portal首页
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: assert
        assertions:
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "navigate后页面头部元素"
            message: Portal首页应可见
  - name: 点击用户信息
    steps:
      - action: click
        target: .header .user-info
      - action: assert
        assertions:
          - type: A1
            target: .user-panel
            expected: visible
            confidence: medium
            inferredFrom: "click后弹出面板"
            message: 用户信息面板应弹出
  - name: 进入管理后台
    steps:
      - action: click
        target: .user-panel .console-btn
        pageTransition: navigate
      - action: wait
        target: .dashboard
        timeout: 5
  - name: 验证跳转
    steps:
      - action: assert
        assertions:
          - type: A2
            target: current-url
            expected: /dashboard
            confidence: high
            inferredFrom: "预期结果-成功跳转到ASDM管理后台首页面"
            message: 应从Portal成功跳转到ASDM管理后台首页面
          - type: A1
            target: .dashboard
            expected: visible
            confidence: medium
            inferredFrom: "navigate后页面结构"
            message: ASDM管理后台首页面应可见
