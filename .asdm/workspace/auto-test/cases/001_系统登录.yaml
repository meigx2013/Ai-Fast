name: 001_system-login-succ
description: 验证用户通过ASDM平台登录流程（正向场景）
framework: playwright
capture: on-fail
tags: [auth, login, happy-path, P1]
source: generate
params:
  email: super-admin@asdm.ai
  password: superadmin@20260214
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已注册
stages:
  - name: 访问ASDM平台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: assert
        assertions:
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "navigate后Portal首页结构"
            message: ASDM Portal页面应可见
  - name: 点击登录入口
    steps:
      - action: click
        target: .header .login-btn
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .login-form
            expected: visible
            confidence: medium
            inferredFrom: "点击【登录】后页面跳转"
            message: ASDM登录页面应可见
  - name: 输入凭证并登录
    steps:
      - action: type
        target: .login-form input[name="email"]
        value: "{{params.email}}"
      - action: type
        target: .login-form input[name="password"]
        value: "{{params.password}}"
      - action: click
        target: .login-form .btn-primary
        capture: always
  - name: 登录验证
    steps:
      - action: wait
        target: .dashboard
        timeout: 5
      - action: assert
        assertions:
          - type: A2
            target: current-url
            expected: /portal
            confidence: medium
            inferredFrom: "预期结果：页面跳转到Portal首页"
            message: 页面应跳转到Portal首页
          - type: A1
            target: .dashboard
            expected: visible
            confidence: medium
            inferredFrom: "预期结果：Portal首页可见"
            message: Portal首页应可见
