# ============================================================
# 用例：系统登录（正向场景）
# 来源文档：docs/test-cases/001_system-login.md（AI 生成，source: generate）
# 数据保真：URL、输入值、操作步骤、预期结果、前置条件均逐字来自用例描述；
#   选择器为 AI 推断（唯一允许推断的字段，已标注 confidence/inferredFrom）
# ============================================================
name: 001_system-login-succ
description: 验证用户通过ASDM平台登录流程（正向场景）。本用例适用于用户进行ASDM平台登录。
framework: playwright
capture: on-fail
tags: [auth, login, happy-path, P1]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已注册
stages:
  - name: 访问ASDM平台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "navigate后Portal首页头部可见性推断（选择器为推断值）"
            message: ASDM平台Portal首页应可见
  - name: 点击登录入口
    steps:
      # 选择器推断：Portal 首页右上角【登录】按钮
      - action: click
        target: '.header >> text=登录'
        pageTransition: navigate
      - action: assert
        assertions:
          - type: A1
            target: .login-form
            expected: visible
            confidence: medium
            inferredFrom: "用户步骤2'页面跳转到ASDM登录页面'，登录表单容器为推断选择器"
            message: ASDM登录页面应可见
  - name: 输入凭证并登录
    steps:
      # 输入值逐字来自用户描述：邮箱 super-admin@asdm.ai
      - action: type
        target: '.login-form input[name="email"]'
        value: super-admin@asdm.ai
      # 输入值逐字来自用户描述：密码 superadmin@20260214
      - action: type
        target: '.login-form input[name="password"]'
        value: superadmin@20260214
      - action: click
        target: '.login-form .btn-primary'
        capture: always
  - name: 登录验证
    steps:
      - action: wait
        target: .header
        timeout: 5
      - action: assert
        assertions:
          - type: A2
            target: current-url
            expected: https://platform-dt02.asdm.ai/
            confidence: high
            inferredFrom: "用户预期结果'页面跳转到 Portal 首页'"
            message: 页面应跳转到 Portal 首页
          - type: A1
            target: .header
            expected: visible
            confidence: medium
            inferredFrom: "用户预期结果'页面跳转到 Portal 首页'，首页头部为推断选择器"
            message: Portal 首页应可见
