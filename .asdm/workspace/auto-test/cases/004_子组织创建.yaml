name: 004_create-sub-org-succ
description: 验证管理员进行子组织的创建（正向场景）
framework: playwright
capture: on-fail
tags: [org, admin, happy-path, P1]
source: generate
params:
  parentOrgName: 测试组织01
  subOrgName: 测试组织0101
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 已创建组织"测试组织01"
stages:
  - name: 选择父组织节点
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .platform-settings .tab-org
      - action: click
        target: ".org-tree .org-node:has-text(\"{{params.parentOrgName}}\") .more-actions-btn"
  - name: 创建子组织
    steps:
      - action: assert
        assertions:
          - type: A1
            target: .create-sub-org-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击...后打开创建子组织窗口"
            message: 创建子组织窗口应可见
      - action: type
        target: .create-sub-org-modal input[name="orgName"]
        value: "{{params.subOrgName}}"
      - action: click
        target: .create-sub-org-modal .btn-create
        capture: always
  - name: 验证子组织创建
    steps:
      - action: wait
        target: .org-tree
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .org-tree
            expected: "{{params.subOrgName}}"
            confidence: medium
            inferredFrom: "预期结果：父节点增加子节点"
            message: 组织树"{{params.parentOrgName}}"节点下应增加子节点"{{params.subOrgName}}"
