# ============================================================
# 用例：子组织创建（正向场景）
# 来源文档：docs/test-cases/004_create-sub-org.md（AI 生成，source: generate）
# 数据保真：输入值、操作步骤、预期结果、前置条件均逐字来自用例描述
# 执行说明：本用例步骤从组织层级树操作开始（严格按用户描述，未添加前置导航步骤），
#   需在 003（组织创建）之后连续执行，或执行前已处于 平台级设置→组织 Tab 页面
# ============================================================
name: 004_create-sub-org-succ
description: 验证管理员创建子组织（正向场景）。本用例适用于管理员进行子组织的创建。
framework: playwright
capture: on-fail
tags: [org, platform-settings, happy-path, P2]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  # 前置登录：凭证来自 001_system-login.md（super-admin 为用例集登录用户，推断适用）
  auth:
    type: login
    loginUrl: https://platform-dt02.asdm.ai/login
    username: super-admin@asdm.ai
    password: superadmin@20260214
  prerequisites:
    - 用户已完成系统登录
    - 已创建组织 "测试组织01"
stages:
  - name: 打开创建子组织窗口
    steps:
      # 选择器推断：组织层级树中"测试组织01"节点右边的 ... 更多操作按钮
      - action: click
        target: '.el-tree-node:has-text("测试组织01") .more-btn'
      # 用户步骤2'打开 [创建子组织] 窗口'的操作转换：点击 ... 后弹出菜单中的"创建子组织"菜单项
      - action: click
        target: '.el-dropdown-menu__item:has-text("创建子组织")'
      - action: assert
        assertions:
          - type: A1
            target: .el-dialog
            expected: visible
            confidence: medium
            inferredFrom: "用户步骤2'打开创建子组织窗口'，对话框容器为推断选择器"
            message: 创建子组织窗口应可见
  - name: 填写子组织信息并创建
    steps:
      # 输入值逐字来自用户描述：组织名称 测试组织0101
      - action: type
        target: '.el-dialog .el-form-item:has-text("组织名称") input'
        value: 测试组织0101
      - action: click
        target: '.el-dialog button:text-is("创建")'
  - name: 验证子组织创建
    steps:
      - action: wait
        target: .el-tree
        timeout: 5
      - action: assert
        assertions:
          - type: A4
            target: .el-tree
            expected: 测试组织0101
            confidence: high
            inferredFrom: "用户步骤5与预期结果'测试组织01节点增加一个子节点 测试组织0101'，组织树容器为推断选择器"
            message: '"测试组织01"节点应增加子节点"测试组织0101"'
