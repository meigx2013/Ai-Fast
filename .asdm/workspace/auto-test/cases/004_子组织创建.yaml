name: 004_create-sub-org-succ
description: 验证管理员进行子组织创建（正向场景）
framework: playwright
capture: on-fail
tags: [org, sub-org, create, happy-path, P1]
source: generate
params:
  parentOrgName: 测试组织01
  subOrgName: 测试组织0101
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 已创建组织"测试组织01"
stages:
  - name: 选择父组织
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/dashboard
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .settings-page .org-tab
      - action: click
        target: .org-tree .org-node-more-btn
      - action: assert
        assertions:
          - type: A1
            target: .create-sub-org-dialog
            expected: visible
            confidence: medium
            inferredFrom: "click后创建子组织窗口打开"
            message: 创建子组织窗口应可见
  - name: 创建子组织
    steps:
      - action: type
        target: .create-sub-org-dialog input[name="orgName"]
        value: "{{params.subOrgName}}"
      - action: click
        target: .create-sub-org-dialog .create-btn
        capture: always
  - name: 验证子组织创建
    steps:
      - action: wait
        target: .org-tree
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .org-tree
            expected: "{{params.subOrgName}}"
            confidence: high
            inferredFrom: "预期结果-组织树增加子节点"
            message: "测试组织01节点应增加一个子节点{{params.subOrgName}}"
