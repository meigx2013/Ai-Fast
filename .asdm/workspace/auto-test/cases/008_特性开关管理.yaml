name: 008_feature-flag-succ
description: 验证管理员进行特性开关配置（正向场景）
framework: playwright
capture: on-fail
tags: [feature-flag, admin, happy-path, P2]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 特性开关项"hide_admin_resource_management"、"minio_storage_enabled"、"hide_mcp_management"存在
stages:
  - name: 进入平台级设置-特性开关
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/admin
      - action: click
        target: .sidebar .platform-settings-btn
      - action: click
        target: .platform-settings .tab-feature-flag
      - action: assert
        assertions:
          - type: A1
            target: .feature-flag-list
            expected: visible
            confidence: medium
            inferredFrom: "点击特性开关Tab后列表可见"
            message: 特性开关列表应可见
  - name: 编辑hide_admin_resource_management
    steps:
      - action: type
        target: .feature-flag-list .search-input
        value: hide_admin_resource_management
      - action: click
        target: ".feature-flag-list .feature-flag-row:has-text(\"hide_admin_resource_management\") .edit-btn"
      - action: assert
        assertions:
          - type: A1
            target: .edit-feature-flag-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击编辑后弹出窗口"
            message: 编辑特性开关窗口应可见
      - action: select
        target: .edit-feature-flag-modal select[name="status"]
        value: 全量开放
      - action: click
        target: .edit-feature-flag-modal .btn-save
        capture: always
  - name: 编辑minio_storage_enabled
    steps:
      - action: type
        target: .feature-flag-list .search-input
        value: minio_storage_enabled
      - action: click
        target: ".feature-flag-list .feature-flag-row:has-text(\"minio_storage_enabled\") .edit-btn"
      - action: assert
        assertions:
          - type: A1
            target: .edit-feature-flag-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击编辑后弹出窗口"
            message: 编辑特性开关窗口应可见
      - action: select
        target: .edit-feature-flag-modal select[name="status"]
        value: 全量开放
      - action: click
        target: .edit-feature-flag-modal .btn-save
  - name: 编辑hide_mcp_management
    steps:
      - action: type
        target: .feature-flag-list .search-input
        value: hide_mcp_management
      - action: click
        target: ".feature-flag-list .feature-flag-row:has-text(\"hide_mcp_management\") .edit-btn"
      - action: assert
        assertions:
          - type: A1
            target: .edit-feature-flag-modal
            expected: visible
            confidence: medium
            inferredFrom: "点击编辑后弹出窗口"
            message: 编辑特性开关窗口应可见
      - action: select
        target: .edit-feature-flag-modal select[name="status"]
        value: 全量开放
      - action: click
        target: .edit-feature-flag-modal .btn-save
  - name: 验证特性开关状态
    steps:
      - action: assert
        assertions:
          - type: A4
            target: ".feature-flag-list .feature-flag-row:has-text(\"hide_admin_resource_management\")"
            expected: 全量开放
            confidence: medium
            inferredFrom: "预期结果：特性开关状态变为全量开放"
            message: hide_admin_resource_management状态应为全量开放
          - type: A4
            target: ".feature-flag-list .feature-flag-row:has-text(\"minio_storage_enabled\")"
            expected: 全量开放
            confidence: medium
            inferredFrom: "预期结果：特性开关状态变为全量开放"
            message: minio_storage_enabled状态应为全量开放
          - type: A4
            target: ".feature-flag-list .feature-flag-row:has-text(\"hide_mcp_management\")"
            expected: 全量开放
            confidence: medium
            inferredFrom: "预期结果：特性开关状态变为全量开放"
            message: hide_mcp_management状态应为全量开放
