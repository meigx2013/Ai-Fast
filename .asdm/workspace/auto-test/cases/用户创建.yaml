name: 005_create-user-succ
description: 验证管理员进行用户创建（正向场景）
framework: playwright
capture: on-fail
tags: [user, management, happy-path, P1]
source: generate
metadata:
  targetUrl: https://platform-dt02.asdm.ai/
  timeout: 30
  browser: chromium
  prerequisites:
    - 用户已完成系统登录
    - 测试组织0101已创建
stages:
  - name: 进入ASDM管理后台
    steps:
      - action: navigate
        target: https://platform-dt02.asdm.ai/
      - action: assert
        assertions:
          - type: A1
            target: .dashboard
            expected: visible
            confidence: medium
            inferredFrom: "navigate后页面结构"
            message: ASDM管理后台首页应可见
  - name: 打开平台级设置
    steps:
      - action: click
        target: .sidebar .settings-btn
      - action: wait
        target: .settings-page
        timeout: 3
      - action: assert
        assertions:
          - type: A1
            target: .settings-page
            expected: visible
            confidence: medium
            inferredFrom: "点击设置后页面切换"
            message: 平台级设置页面应可见
  - name: 切换到用户Tab
    steps:
      - action: click
        target: .tabs .user-tab
      - action: assert
        assertions:
          - type: A1
            target: .user-list
            expected: visible
            confidence: medium
            inferredFrom: "切换Tab后用户列表展示"
            message: 用户列表应可见
  - name: 打开创建用户窗口
    steps:
      - action: click
        target: .user-page .create-user-btn
      - action: wait
        target: .create-user-dialog
        timeout: 3
      - action: assert
        assertions:
          - type: A1
            target: .create-user-dialog
            expected: visible
            confidence: medium
            inferredFrom: "点击创建按钮后弹窗"
            message: 新建用户窗口应可见
  - name: 录入用户信息
    steps:
      - action: type
        target: .create-user-dialog input[name="email"]
        value: test01@asdm.ai
      - action: type
        target: .create-user-dialog input[name="password"]
        value: admin@2026
      - action: type
        target: .create-user-dialog input[name="lastName"]
        value: 测试
      - action: type
        target: .create-user-dialog input[name="firstName"]
        value: 一
  - name: 添加角色映射
    steps:
      - action: click
        target: .create-user-dialog .add-role-mapping-btn
      - action: select
        target: .role-mapping .role-select
        value: 组织管理员
      - action: select
        target: .role-mapping .org-select
        value: 测试组织0101
  - name: 提交创建用户
    steps:
      - action: click
        target: .create-user-dialog .create-user-btn
        capture: always
  - name: 验证用户创建结果
    steps:
      - action: wait
        target: .user-list
        timeout: 3
      - action: assert
        assertions:
          - type: A4
            target: .user-list
            expected: test01@asdm.ai
            confidence: high
            inferredFrom: "用户预期结果-用户列表增加记录"
            message: 用户列表中应增加一条记录包含test01@asdm.ai
