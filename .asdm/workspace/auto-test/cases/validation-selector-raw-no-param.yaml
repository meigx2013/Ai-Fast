# Phase 3 验证用例 3：selectorStrategy=raw + dataParam=false（无优化无参数化）
# 本文件用于验证 raw 模式下选择器保持原样 + 无参数化的产出物

name: validation-selector-raw-no-param
description: "端到端验证用例 - 原始选择器模式（无优化、无参数化）"
framework: selenium
tags:
  - module:user
  - feature:profile-view
  - validation:e2e

recordedAt: "2026-07-20T10:40:00Z"

viewportActual:
  width: 1024
  height: 768

frontFramework: react

selectorStrategy: raw

# dataParam=false → 无 params 块，值保持硬编码

stages:
  - name: "查看用户详情"
    steps:
      # raw 模式：选择器保持 Codegen 原始输出，不做优化
      - action: navigate
        target: "/user/profile"
        pageTransition: navigate
        assertions:
          - type: visible
            target: "css=.user-profile-page"
          - type: titleMatch
            expected: "用户详情"

      # raw 模式：选择器未优化，保持 nth-child / 非语义 class
      - action: click
        target: "css=.user-list > div:nth-child(3) > a"
        assertions:
          - type: urlMatch
            expected: "/user/profile/3"
          - type: textMatch
            target: "css=.profile-header h2"
            expected: "用户详情"

      # 手写断言（用户手动添加）不标注 confidence 和 inferredFrom
      - action: visible
        target: "css=#user-detail-card"
        assertions:
          - type: visible
            target: "css=#user-detail-card"
          # 手写断言 — 不标注 confidence/inferredFrom（视为确定性断言）
          - type: textMatch
            target: "css=#user-detail-card .user-name"
            expected: "张三"
