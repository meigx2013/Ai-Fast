# Web Auto Tester CI/CD 配置文件
# 平台: Azure Pipelines
# 生成时间: 2026-07-14
# Node.js 版本: 18
# 浏览器: chromium
#
# 使用说明：
# 1. 将此文件移动到项目根目录 azure-pipelines.yml 位置
# 2. 根据项目实际分支调整触发条件
# 3. 确保 CI 环境已安装 Node.js 18 和 Playwright 浏览器
# 4. 如需通知，配置 Azure DevOps 集成通知

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/*
      - .asdm/workspace/auto-test/cases/*

pr:
  branches:
    include:
      - main
      - develop

variables:
  nodeVersion: '18'
  casesDir: '.asdm/workspace/auto-test/cases'
  resultsDir: '.asdm/workspace/auto-test/results'
  reportsDir: '.asdm/workspace/auto-test/reports'
  screenshotsDir: '.asdm/workspace/auto-test/screenshots'

stages:
  - stage: Install
    jobs:
      - job: InstallEnv
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install npm dependencies'

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          - script: |
              mkdir -p $(casesDir)
              mkdir -p $(resultsDir)
              mkdir -p $(reportsDir)
              mkdir -p $(screenshotsDir)
            displayName: 'Create workspace directories'

  - stage: Test
    dependsOn: Install
    jobs:
      - job: RunTests
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=== 执行 Web Auto Tester 测试 ==="
              # 执行 YAML DSL 测试用例
              # 通过 Node.js 脚本桥接执行引擎
            displayName: 'Run auto tests'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(resultsDir)'
              artifactName: 'auto-test-results'
            displayName: 'Publish test results'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(screenshotsDir)'
              artifactName: 'auto-test-screenshots'
            displayName: 'Publish screenshots'

  - stage: Report
    dependsOn: Test
    condition: always()
    jobs:
      - job: GenerateReport
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=== 生成测试报告 ==="
              # 通过 Node.js 脚本桥接报告引擎
            displayName: 'Generate HTML report'

          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              pathToPublish: '$(reportsDir)'
              artifactName: 'auto-test-report'
            displayName: 'Publish HTML report'
