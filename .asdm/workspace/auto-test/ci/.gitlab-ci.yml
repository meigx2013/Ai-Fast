# Web Auto Tester CI/CD 配置文件
# 平台: GitLab CI
# 生成时间: 2026-07-14
# Node.js 版本: 18
# 浏览器: chromium
#
# 使用说明：
# 1. 将此文件移动到项目根目录 .gitlab-ci.yml 位置
# 2. 根据项目实际分支调整触发条件
# 3. 确保 CI 环境已安装 Node.js 18 和 Playwright 浏览器
# 4. 如需 Webhook 通知，配置 GitLab 集成通知

stages:
  - install
  - test
  - report

variables:
  NODE_VERSION: "18"
  CASES_DIR: ".asdm/workspace/auto-test/cases"
  RESULTS_DIR: ".asdm/workspace/auto-test/results"
  REPORTS_DIR: ".asdm/workspace/auto-test/reports"
  SCREENSHOTS_DIR: ".asdm/workspace/auto-test/screenshots"

install_env:
  stage: install
  image: node:18
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - mkdir -p $CASES_DIR $RESULTS_DIR $REPORTS_DIR $SCREENSHOTS_DIR

run_tests:
  stage: test
  image: node:18
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - echo "=== 执行 Web Auto Tester 测试 ==="
    # 执行 YAML DSL 测试用例
    # 通过 Node.js 脚本桥接执行引擎
  artifacts:
    when: always
    paths:
      - $RESULTS_DIR/*.json
      - $SCREENSHOTS_DIR/*.png
    expire_in: 30 days

generate_report:
  stage: report
  image: node:18
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - echo "=== 生成测试报告 ==="
    # 通过 Node.js 脚本桥接报告引擎
    - if command -v allure; then allure generate $REPORTS_DIR/allure-results -o $REPORTS_DIR/allure-report --clean; fi
  artifacts:
    when: always
    paths:
      - $REPORTS_DIR/*.html
      - $REPORTS_DIR/allure-report/**
    expire_in: 90 days
  only:
    - main
    - develop
